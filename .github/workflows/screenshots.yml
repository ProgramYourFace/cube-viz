# -----------------------------------------------------------------------------
# Screenshots — photograph the chart families and the CHART EDITOR on every push
# and PR, and upload the PNGs as a build artifact so a reviewer can SEE the
# rendering change instead of reading a diff of chart code.
#
# It runs on a clean runner with NO Cube server and NO secrets: the Vite dev
# server that `scripts/shots.mjs` boots mounts `playground/vite-cube-mock.ts`,
# which serves an offline `/cubejs-api/v1` (meta + load) that the REAL
# `@cubejs-client/core` consumes — so the adapter/normalize/render path under
# test is the production one, just fed canned HTTP. Nothing here reads
# CUBE_API_URL / CUBE_API_SECRET; the mock refuses to be bypassed because the
# shots script sets CUBE_MOCK=1.
#
# Artifact: `chart-screenshots` → charts-{light,dark}.png,
# editor-{light,dark}.png, editor-type-picker.png.
# -----------------------------------------------------------------------------
name: Screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Prefer the frozen lockfile for reproducibility, but don't fail the run on a
      # lockfile the current bun disagrees with — the screenshots are the point.
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      # Chromium + its system libraries. `bunx playwright` resolves the workspace's
      # own playwright, so the browser build matches the installed client.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Not required by the shots (they run against Vite dev + library SOURCE), but
      # it keeps a broken build from silently shipping a green screenshot run.
      - name: Build library
        run: bun run build

      # A tile that silently draws the wrong family is the failure mode a
      # screenshot hides, so assert per-tile geometry before capturing.
      - name: Verify every type-picker tile draws its own chart type
        run: bun run verify:type-picker

      - name: Capture screenshots
        run: bun run shots

      - uses: actions/upload-artifact@v4
        # Upload even when a shot failed: a wrong-looking PNG is the fastest way to
        # see WHY it failed.
        if: always()
        with:
          name: chart-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
