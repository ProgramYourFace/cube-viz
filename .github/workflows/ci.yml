# -----------------------------------------------------------------------------
# CI — typecheck + unit tests on every PR (and master pushes).
#
# Deliberately minimal so it stays fast (~20s): no browser install, no
# screenshots, no build. The committed dist/ is regenerated by release.yml on
# master; this workflow only guards the source tree that produces it.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test
